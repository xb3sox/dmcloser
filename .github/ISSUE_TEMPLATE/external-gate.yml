name: External Gate Report
description: Report status, attach evidence, or track compliance for an external verification or approval gate
title: "[Gate]: "
labels: ["gate", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to track external verification, launch gates, security reviews, or partner compliance approvals (e.g. Meta App Review, Stripe Verification).
  - type: input
    id: requirement_id
    attributes:
      label: Requirement or Gate ID
      description: The canonical ID of the requirement or gate (e.g., FEAT-001, FR-002, META-APP-REVIEW, STRIPE-VERIFY).
      placeholder: e.g. META-APP-REVIEW
    validations:
      required: true
  - type: textarea
    id: gate_description
    attributes:
      label: Gate Scope & Context
      description: Describe the scope, objective, and requirements of this external gate.
      placeholder: Explain what external approval or launch verification is required...
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Gate Status
      options:
        - Pending Evidence Submission
        - Under Review
        - Passed / Approved
        - Blocked / Action Required
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence Attached / Execution Logs
      description: Provide test execution logs, command outputs, audit trails, or screenshot URLs demonstrating gate completion.
      placeholder: |
        ```bash
        node scripts/check.mjs
        ```
        Evidence URLs / Notes:
    validations:
      required: true
  - type: textarea
    id: rollback_remediation
    attributes:
      label: Remediation & Risk Mitigation Plan
      description: If the gate is blocked or failed, detail the required fixes, action items, or compensating controls.
      placeholder: Outline remediation steps if blocked or failing...
    validations:
      required: false
