name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Install the dependency tree
        run: |
          # `npm sbom` validates the tree against package-lock.json and fails when
          # node_modules is absent, so install without running lifecycle scripts.
          npm ci --ignore-scripts
      - name: Generate the dependency SBOM
        run: |
          # CycloneDX, generated by npm from package-lock.json. Scope is the resolved
          # dependency graph, not the image filesystem: base-image packages are not listed.
          npm sbom --sbom-format=cyclonedx --omit=dev > "dmcloser-$GITHUB_REF_NAME.cdx.json"
          test -s "dmcloser-$GITHUB_REF_NAME.cdx.json"
          node -e "const s=require('./dmcloser-$GITHUB_REF_NAME.cdx.json'); if(s.bomFormat!=='CycloneDX') process.exit(1); console.log('components:', s.components.length)"
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dmcloser-$GITHUB_REF_NAME.cdx.json" --clobber
