name: Merge Gate
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject foreign lockfiles
        run: |
          for file in pnpm-lock.yaml yarn.lock; do
            if [ -f "$file" ]; then
              echo "::error::$file is not allowed. Use npm and commit package-lock.json."
              exit 1
            fi
          done
      - name: Require a linked issue
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json body --jq .body)
          if ! printf '%s' "$body" | grep -Eqi '(closes|fixes|resolves)[[:space:]]+#[0-9]+'; then
            echo "::error::Link the issue with Closes #N in the PR body."
            exit 1
          fi
      - name: Limit review size
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          total=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" -- . ':(exclude)package-lock.json' \
            | awk '{added += $1; deleted += $2} END {print added + deleted + 0}')
          echo "Changed lines excluding package-lock.json: $total"
          if [ "$total" -gt 400 ]; then
            echo "::error::PR changes $total lines. Split it to 400 or fewer, excluding package-lock.json."
            exit 1
          fi
