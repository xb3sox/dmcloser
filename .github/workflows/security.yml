name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
concurrency:
  # Keyed by event as well as ref: the weekly schedule and a push to main share
  # refs/heads/main, and they must not cancel each other.
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# Actions are pinned by commit SHA with the tag in a comment. A tag can be repointed at a
# different commit; a SHA cannot. Dependabot keeps both the SHA and the comment current.
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          # Verify the release archive against its published checksum before running it.
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --log-opts HEAD --verbose --redact --exit-code 1
  filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan
        run: |
          # Digest-pinned image: the tag alone can be moved to a different manifest.
          docker run --rm -v "$PWD:/src" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed /src
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Semgrep TypeScript and Node rules
        run: semgrep scan --config p/typescript --config p/nodejs --severity ERROR --error
