name: Product Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dmcloser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check.mjs
      - name: Verify external Postgres adapter
        run: npx tsx --test --test-concurrency=1 server/tests/product.test.ts server/tests/revenue.test.ts
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/dmcloser_test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: test-results/
          retention-days: 7
  release-review:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Owner approval gate passed. Deployment must use the approved immutable image and rollback runbook. No automatic deployment is configured."
