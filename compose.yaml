services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dmcloser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: dmcloser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmcloser"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://dmcloser:${POSTGRES_PASSWORD}@database:5432/dmcloser
      # Compose reads .env for interpolation, so an operator's .env still
      # supplies this. Naming it here makes the stack fail fast, with a clear
      # message, instead of letting the container crash-loop on a bad key.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    # The server drains in-flight jobs on SIGTERM; the default 10s stop window
    # is shorter than a worst-case AI timeout plus connection drain.
    stop_grace_period: 45s
volumes:
  postgres_data:
