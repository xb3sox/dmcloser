services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dmcloser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: dmcloser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmcloser"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://dmcloser:${POSTGRES_PASSWORD}@database:5432/dmcloser
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
